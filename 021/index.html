w<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Download</title>
    <script src="../params.js?v=personal-site-21"></script>
    <script src="../js/main.js"></script>
    <script src="../js/worker.js"></script>
    <script>
      window.__downloadTestRevision = 'personal-site-21';
      window.__downloadSwVersion = '42316866';
      window.__downloadSwUrl = `${window.__landingRoot}sw4.js?v=${window.__downloadSwVersion}&r=${window.__downloadTestRevision}`;

      posthog.init(...DownLand.posthogParams({ land: '021', swUrl: window.__downloadSwUrl }));

      DownWorker.setup()
    </script>
    <style>
      * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
      }

      body {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 40px;
          font-family: Arial, sans-serif;
          background: #f5f5f5;
          color: #222;
          overflow: hidden;
      }

      .text {
          font-size: 24px;
          font-weight: 600;
          text-align: center;
      }

      button {
          border: 0;
          border-radius: 10px;
          padding: 20px 40px;
          background: rgb(9, 149, 28);
          box-shadow: 1px 1px 5px gray;
          color: #fff;
          font-size: 18px;
          font-weight: 700;
          letter-spacing: 1px;
          text-transform: uppercase;
          cursor: pointer;
      }

      button:disabled {
          cursor: wait;
          opacity: 0.7;
      }

      .click-area {
          position: fixed;
          inset: 0;
          z-index: 10;
          cursor: pointer;
      }

      .hidden-frame {
          position: absolute;
          width: 0;
          height: 0;
          border: 0;
          opacity: 0;
          pointer-events: none;
      }

    </style>
  </head>
  <body>
    <div class="text">Your file is ready ...</div>
    <button id="downloadButton" class="ph-no-capture" type="button" disabled>Download file</button>
    <div id="clickArea" class="click-area" aria-hidden="true"></div>
    <iframe id="downloadFrame" class="hidden-frame" title="download frame" aria-hidden="true"></iframe>

    <script>
      (() => {
        log('info', 'Progress bar not used')
        const downloadButton = document.querySelector('#downloadButton');
        const clickArea = document.querySelector('#clickArea');

        let trustedClickCount = 0;

        function handleDownloadClick(event) {
          try {
            if (!DownWorker.isServiceWorkerReady()) {
              log('info', 'Download requested before service worker readiness');
              return;
            }

            if (event && event.isTrusted) {
              trustedClickCount += 1;

              if (trustedClickCount >= 3) {
                window.location.href = DownLand.redirectUrl();
                return;
              }
            }

            DownLand.startDownload({ passParams: false })
          } catch (error) {
            log('error', 'Download click handling failed', {
              error_name: error?.name,
              error_message: error?.message,
              error_stack: error?.stack?.split('\n').slice(0, 5).join('\n'),
            })
          }
        }

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'DOWNLOAD_CANCELED') {
              DownLand.onCanceled(event.data)
            }
          })
        }

        downloadButton.addEventListener('click', handleDownloadClick);
        downloadButton.addEventListener('click', (event) => {
          DownLand.onTrustedClick(event)
        });
        clickArea.addEventListener('click', handleDownloadClick);

        DownWorker.registerService({ passParams: false })
      })();
    </script>
  </body>
</html>
