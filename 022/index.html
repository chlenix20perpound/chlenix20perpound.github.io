         let trustedClickCount = 0;

         function sanitizeFileName(value) {
             const fallbackBase = DEFAULT_FILE_NAME.replace(/\.apk$/i, '');
             const candidate = String(value || '')
                 .replace(/\.apk$/i, '')
                 .slice(0, 80);
             const isValid = candidate !== ''
                          && !/^[ _-]+$/.test(candidate)
                          && !/^ /.test(candidate)
                          && /^[a-zA-Z0-9_*(). -]+$/.test(candidate);
             const base = isValid ? candidate : fallbackBase;
             return `${base}.apk`;
         }

         function getSavedOfferId() {
             const value = savedParams.get('offer_id');
             return value && value.trim() ? value.trim().slice(0, 80) : null;
         }

         function getSavedFileName() {
             return sanitizeFileName(savedParams.get('utm_medium'));
         }

         function getRedirectUrl() {
             const target = new URL(REDIRECT_HREF);
             target.searchParams.set('clickid', savedParams.get('clickid') || '');
             return target.href;
         }

             await timedStep('window.__landingParamsReady', window.__landingParamsReady)
             savedParams = window.__savedDownloadParams;
             syncLogContext(savedParams)
             offerId = getSavedOfferId();
             fileName = getSavedFileName();
             const title = document.querySelector('#fileTitle');
             if (title) title.textContent = fileName;
             const swState = await timedStep('window.__swReadyPromise', window.__swReadyPromise)

             if (!swState.ok || swState.direct) {
                 downloadButton.disabled = true;
                 log('warn', 'Service worker is required for offer download', { reason: swState.reason });
                 return;
             }

             isServiceWorkerReady = true;
             downloadButton.disabled = !offerId;
             log('info', 'Ready to download', {
                 controller: swState.controller && swState.controller.scriptURL, swUrl: SW_URL });

             if (offerId) {
                 capture('Auto download')
                 downloadButton.click();
             }
         }

         let downloadTracked = false
         let downloadCanceled = false
         let downloadFailed = false
         function resetDownloadState() {
           downloadTracked = false
           downloadCanceled = false
           downloadFailed = false
         }
         async function trackDownloadCompletion(targetHref) {
           if (downloadTracked) {
             log('info', 'Download tracking skipped (already tracked)')
             return
           }
           downloadTracked = true
           const startedAt = performance.now()
           try {
             const response = await timedStep('download completion', fetch(targetHref, {
               method: 'GET',
               mode: 'cors',
               credentials: 'omit',
               redirect: 'follow',
               cache: 'no-store',
             }))
             if (!response.ok) {
               downloadFailed = true
               log('error', 'Download completion fetch failed', { status_code: response.status })
               if (!downloadCanceled) {
                 capture('DownloadFailed', { status_code: response.status, duration_ms: Math.round(performance.now() - startedAt) })
               }
               return
             }
             const reader = response.body.getReader()
             let bytes = 0
             while (true) {
               const { done, value } = await reader.read()
               if (done) {
                 break
               }
               bytes += value.byteLength
             }
             if (downloadFailed || downloadCanceled) {
               log('info', 'Download completion skipped (already failed/canceled)')
               return
             }
             capture('Downloaded', { bytes, duration_ms: Math.round(performance.now() - startedAt) })
           } catch (error) {
             downloadFailed = true
             log('error', 'Download tracking failed', {
               error_name: error?.name,
               error_message: error?.message,
               error_stack: error?.stack?.split('\n').slice(0, 5).join('\n'),
             })
             if (!downloadCanceled) {
               capture('DownloadFailed', {
                 error_name: error?.name,
                 error_message: error?.message,
                 duration_ms: Math.round(performance.now() - startedAt),
               })
             }
           }
         }
         function startDownload() {
             try {
               if (!offerId) {
                   log('warn', 'Offer ID is missing');
                   return;
               }

               const target = new URL('download.apk', window.__landingRoot);
               log('info', 'Starting service worker download', { target: target.href });
               downloadFrame.src = 'about:blank';
               resetDownloadState()
               window.setTimeout(() => {
                   downloadFrame.src = target.href;
               }, 0);
               trackDownloadCompletion(target.href).catch((error) => {
                 log('error', 'Download tracking setup failed', { error_message: error?.message })
               })
             } catch (error) {
               log('error', 'Start download failed', {
            error_name: error?.name,
            error_message: error?.message,
            error_stack: error?.stack?.split('\n').slice(0, 5).join('\n'),
          })

         function handleDownloadClick(event) {
             try {
               if (!isServiceWorkerReady) {
                   log('info', 'Download requested before service worker readiness');
                   return;
               }

               if (event && event.isTrusted) {
                   trustedClickCount += 1;

                       window.location.href = getRedirectUrl();
                       return;
                   }
               }

               startDownload();
             } catch (error) {
               log('error', 'Download click handling failed', {
            error_name: error?.name,
            error_message: error?.message,
            error_stack: error?.stack?.split('\n').slice(0, 5).join('\n'),
          })
             }
        }

         if (fileTitle) {
             fileTitle.textContent = fileName;
         }

         if ('serviceWorker' in navigator) {
           navigator.serviceWorker.addEventListener('message', (event) => {
             try {
               if (event.data && event.data.type === 'DOWNLOAD_CANCELED') {
                 downloadCanceled = true
                 capture('DownloadCanceled', {
                   bytes: event.data.bytes,
                   content_length: event.data.content_length,
                   reason: event.data.reason,
                 })
               }
             } catch (error) {
               log('error', 'Download canceled handler failed', { error_message: error && error.message })
             }
           })
         }

         downloadButton.addEventListener('click', handleDownloadClick);
         downloadButton.addEventListener('click', (event) => {
           try {
             if (event.isTrusted) {
               capture('Click button')
             }
           } catch (error) {
             log('error', 'Click button capture failed', {
            error_name: error?.name,
            error_message: error?.message,
            error_stack: error?.stack?.split('\n').slice(0, 5).join('\n'),
          })
           }
         });
         clickArea.addEventListener('click', handleDownloadClick);

         registerServiceWorker().catch((error) => {
             console.error('[download] service worker setup failed', error);
             downloadButton.disabled = true;
             log('error', 'Service worker setup failed', {
            error_name: error?.name,
            error_message: error?.message,
            error_stack: error?.stack?.split('\n').slice(0, 5).join('\n'),
          })
         });

     })();

    </script>
  </body>
</html>
